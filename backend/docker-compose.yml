services:
  app:
    build:
      context: ./docker
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - vendor_data:/var/www/html/vendor
      - storage_framework_data:/var/www/html/storage/framework
    environment:
      - APP_ENV=local
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
    command: php artisan serve --host=0.0.0.0 --port=8000

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mudesco
      POSTGRES_USER: mudesco
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
  vendor_data:
  storage_framework_data:
